# Render blueprint. In Render: New → Blueprint → point at this repo.
#
# Sizing (measured, see DEPLOY.md):
#  - 1 CPU minimum. 0.1 CPU never finishes pairing; 0.5 is marginal.
#  - 2 GB RAM minimum. Pairing loads every group on the account; 512 MB was
#    OOM-killed at 127 groups and the linked account has ~330.
#  - Always on. Sleeping kills the browser and drops the WhatsApp session.
#
# The persistent disk at /app/data holds everything that must survive a
# redeploy: the WhatsApp login (so the owner does not re-scan), captured messages,
# the chosen groups, and the extraction caches (so history is not re-paid).
services:
  - type: web
    name: surfboard-monitor
    runtime: docker
    plan: standard          # 1 CPU / 2 GB
    # /healthz is public and always will be. /api/dates needs an admin session
    # now, so a check against it would be refused and the deploy marked failed.
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 5          # ~0.5 GB per linked WhatsApp, plus the message store
    envVars:
      - key: WWEBJS_PATH
        value: /app/data/wwebjs_auth
      - key: C3_PROVIDER
        value: anthropic
      - key: C3_ANTHROPIC_MODEL
        sync: false     # the Anthropic model name; set in the Render dashboard
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: ANTHROPIC_API_KEY
        sync: false     # set in the Render dashboard
      # Password for the dashboard. Without it the URL is open to anyone, and
      # this app can broadcast from the linked WhatsApp account.
      - key: APP_PASSWORD
        sync: false     # set in the Render dashboard
      # The two groups the boxes start filled with. Names live here, not in the
      # source, so a client's group names never reach the repository. Either can
      # still be typed over in the app at any time.
      - key: C5_GROUP
        sync: false     # set in the Render dashboard
      - key: C3_GROUP
        sync: false     # set in the Render dashboard
      # Accounts. ADMIN_EMAIL and ADMIN_PASSWORD create the owner's account on the
      # first boot; after that the password is changed in the app, not here.
      # Without them the older APP_PASSWORD still works and signs the admin in.
      - key: ADMIN_EMAIL
        sync: false     # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false     # only read when the account is first created
      # Signs session cookies. Changing it signs everyone out, which is what
      # should happen when a secret is rotated.
      - key: SESSION_SECRET
        sync: false     # set in the Render dashboard
      # Everything a customer's WhatsApp writes lives under here, one folder per
      # account, on the same persistent disk.
      - key: USERS_FILE
        value: /app/data/users.json
      - key: USERS_DATA_DIR
        value: /app/data/customers
      # How long a customer's browser may sit unused before it is closed. Each
      # one costs well over a gigabyte, and closing it does not unlink them.
      - key: WORKER_IDLE_MINUTES
        value: 30
